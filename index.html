<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morok</title>
  </head>
  <body>
    <div id="game"></div>

    <div class="hud" id="hud">
      <div class="xp-bar">
        <div class="xp-fill" id="xpFill"><i id="xpFlash"></i></div>
      </div>
      <div class="level" id="level"></div>
      <div class="clock">
        <div id="timer">00:00</div>
      </div>
      <div class="kills">
        <img id="killsIcon" src="/src/art/sprites/icon-skull.png" alt="" />
        <span id="kills">0</span>
      </div>
    </div>

    <div class="screen" id="screen"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
