<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morok</title>
  </head>
  <body>
    <div id="game"></div>

    <div class="hud" id="hud">
      <div>
        <small id="hpLabel"></small>
        <div class="hp-bar"><i id="hpFill"></i></div>
      </div>
      <div class="clock">
        <div id="timer">00:00</div>

      </div>
      <div class="kills">
        <div id="kills">0</div>
        <small id="killsLabel"></small>
      </div>
    </div>

    <div id="banner"></div>
    <div class="screen" id="screen"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
